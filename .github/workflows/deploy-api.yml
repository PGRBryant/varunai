name: Deploy API

on:
  push:
    branches: [main]
    paths: ['apps/varunai-api/**', 'packages/shared/**']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: varunai-api@varunai-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker build -t us-central1-docker.pkg.dev/varunai-prod/varunai-images/varunai-api:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/varunai-prod/varunai-images/varunai-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update varunai-api \
            --image us-central1-docker.pkg.dev/varunai-prod/varunai-images/varunai-api:${{ github.sha }} \
            --region us-central1

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe varunai-api --region us-central1 --format 'value(status.url)')
          curl -sf "$URL/health" || exit 1
