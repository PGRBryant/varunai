name: E2E on GCP

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: varunai-ci@varunai-490119.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Verika service token from Secret Manager
        run: |
          set -eux
          # Attempt to read the VERIKA_SERVICE_TOKEN secret and export it for later steps
          if gcloud secrets versions access latest --secret=VERIKA_SERVICE_TOKEN >/dev/null 2>&1; then
            echo "VERIKA_SERVICE_TOKEN=$(gcloud secrets versions access latest --secret=VERIKA_SERVICE_TOKEN)" >> $GITHUB_ENV
          else
            echo "No secret VERIKA_SERVICE_TOKEN found in Secret Manager; ensure it exists or set a repo secret"
          fi

      - name: Run e2e smoke checks
        env:
          VERIKA_ENDPOINT: https://verika-api-hdzhlg4y7a-ue.a.run.app
        run: |
          bash scripts/ci/e2e.sh
